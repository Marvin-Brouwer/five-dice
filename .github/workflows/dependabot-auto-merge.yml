# Approves every dependabot PR, majors included, and queues it for auto-merge.
# The merge itself waits on the branch protection's required checks, so only a
# green pipeline lands.
#
# Both steps run as the personal token. A merge performed as GITHUB_TOKEN does
# not trigger the push workflows on main, so nothing would deploy, and it cannot
# land the github-actions bumps, since those touch .github/workflows.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-approve and merge
    runs-on: ubuntu-latest
    # Keyed on the PR's author rather than github.actor, so it still runs when
    # someone else pushes to the branch, e.g. through "Update branch".
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.DEPENDABOT_APPROVE_TOKEN }}
    steps:
      - name: Auto-approve
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
