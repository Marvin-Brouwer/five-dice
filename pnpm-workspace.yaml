packages:
  - app

# pnpm 11 reads `allowBuilds`; both `sharp` and `esbuild` are reached through
# the app's own dev dependencies -- sharp via @vite-pwa/assets-generator, and
# esbuild directly, since vite 8 only lists it as an optional peer yet needs it
# to minify the CSS inlined in index.html.
allowBuilds:
  esbuild: true
  sharp: true

# The @rooted/* and @rooted-adapters/* alphas are published as this app needs
# them, so they are always younger than the release-age gate.
minimumReleaseAgeExclude:
  - '@rooted-adapters/github-pages@1.0.0-alpha.28'
  - '@rooted/adapter@1.0.0-alpha.28'
  - '@rooted/application@1.0.0-alpha.42'
  - '@rooted/components@1.0.0-alpha.25'
  - '@rooted/dom-globals@1.0.0-alpha.1'
  - '@rooted/elements@1.0.0-alpha.17'
  - '@rooted/events@1.0.0-alpha.17'
  - '@rooted/localization@1.0.0-alpha.22'
  - '@rooted/markdown@1.0.0-alpha.13'
  - '@rooted/observers@1.0.0-alpha.1'
  - '@rooted/prerender@1.0.0-alpha.1'
  - '@rooted/pwa@1.0.0-alpha.6'
  - '@rooted/router@1.0.0-alpha.32'
  - '@rooted/seo@1.0.0-alpha.20'
  - '@rooted/util@1.0.0-alpha.15'
  - '@rooted/storage@1.0.0-alpha.13'
  - '@rooted/store@1.0.0-alpha.13'
