packages:
  - app

# pnpm 11 reads `allowBuilds`; both `sharp` and `esbuild` are reached through
# the app's own dev dependencies -- sharp via @vite-pwa/assets-generator, and
# esbuild directly, since vite 8 only lists it as an optional peer yet needs it
# to minify the CSS inlined in index.html.
allowBuilds:
  esbuild: true
  sharp: true

# The @rooted/* and @rooted-adapters/* alphas are published as this app needs
# them, so they are always younger than the release-age gate.
minimumReleaseAgeExclude:
  - '@rooted-adapters/github-pages@1.0.0-alpha.27'
  - '@rooted/adapter@1.0.0-alpha.27'
  - '@rooted/application@1.0.0-alpha.41'
  - '@rooted/components@1.0.0-alpha.24'
  - '@rooted/elements@1.0.0-alpha.16'
  - '@rooted/events@1.0.0-alpha.16'
  - '@rooted/localization@1.0.0-alpha.21'
  - '@rooted/markdown@1.0.0-alpha.12'
  - '@rooted/observers@1.0.0-alpha.1'
  - '@rooted/pwa@1.0.0-alpha.5'
  - '@rooted/router@1.0.0-alpha.31'
  - '@rooted/seo@1.0.0-alpha.19'
  - '@rooted/util@1.0.0-alpha.14'
  - '@rooted/storage@1.0.0-alpha.12'
  - '@rooted/store@1.0.0-alpha.12'
