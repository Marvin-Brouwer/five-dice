packages:
  - app

# pnpm 11 reads `allowBuilds`; both `sharp` and `esbuild` are reached through
# the app's own dev dependencies -- sharp via @vite-pwa/assets-generator, and
# esbuild via the vite that vitest bundles.
allowBuilds:
  esbuild: true
  sharp: true

# The @rooted/* alphas are published as this app needs them, so they are
# always younger than the release-age gate.
minimumReleaseAgeExclude:
  - '@rooted/adapter@1.0.0-alpha.15'
  - '@rooted/application@1.0.0-alpha.27'
  - '@rooted/components@1.0.0-alpha.18'
  - '@rooted/elements@1.0.0-alpha.11'
  - '@rooted/events@1.0.0-alpha.11'
  - '@rooted/localization@1.0.0-alpha.11'
  - '@rooted/markdown@1.0.0-alpha.6'
  - '@rooted/router@1.0.0-alpha.22'
  - '@rooted/seo@1.0.0-alpha.9'
  - '@rooted/util@1.0.0-alpha.9'
  - '@rooted/storage@1.0.0-alpha.7'
  - '@rooted/store@1.0.0-alpha.6'
