<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="alternate icon" href="/icon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<!--
			Browser chrome — the minimal-ui toolbar, the status bar, the splash — paints with
			these. They mirror --color-page from index.tokens.css / index.theme.css so the
			chrome continues the cardboard the app bar sits on. The pair covers first paint by
			OS preference; theme-color.mts takes over once the app has resolved what the player
			actually picked (system / sensor / light / dark).
		-->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#b8b2a6" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a2622" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Five dice — a score-pad PWA for a game of five dice." />
		<title>Five dice</title>
		<script crossorigin type="module" src="/src/application.mts"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" />
		<link rel="stylesheet" href="/index.tokens.css" />
		<link rel="stylesheet" href="/index.theme.css" />
		<link rel="stylesheet" href="/index.global.css" />
	</head>

	<body>
		<div id="app"></div>
	</body>

</html>
