<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="alternate icon" href="/icon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<meta name="theme-color" content="#000000" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Five dice — a score-pad PWA for a game of five dice." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<title>Five dice</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Taken out of the render path. A render-blocking third-party sheet
		     means nothing paints at all -- the splash below included -- until
		     fonts.googleapis.com answers. `media="print"` keeps this one out of
		     the way until onload flips it, and the preload above starts the
		     request all the same. The families already carry `display=swap`, so
		     text that beats them renders in the fallback and swaps, which is
		     what a slow sheet does today anyway. -->
		<link rel="preload" as="style"
			href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" />
		<link rel="stylesheet" media="print" onload="this.media='all'"
			href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" />
		<link rel="stylesheet" href="/index.tokens.css" />
		<link rel="stylesheet" href="/index.theme.css" />
		<link rel="stylesheet" href="/index.global.css" />
		<link rel="stylesheet" href="/index.splash.css" />
		<noscript>
			<link rel="stylesheet"
				href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" />
			<!-- Without JS there is no app coming, so the splash stops being a
			     wait and becomes the page: the die holds still and says why.
			     Which language it says it in comes off <html lang>, which the
			     build writes per locale -- nothing else here knows one.

			     Qualified by `html` to outrank index.splash.css's own rules:
			     the build folds that sheet into a bundle it links after this
			     block, so coming later in the head is not something this can
			     rely on. -->
			<style>
				html #splash svg { animation: none; }
				html:lang(nl) #splash .splash-message-nl,
				html:not(:lang(nl)) #splash .splash-message-en { display: block; }
			</style>
		</noscript>
		<script crossorigin type="module" src="/src/application.mts"></script>
	</head>

	<body>
		<!-- The cold-start splash -- see docs/loading-splash.md. Markup rather
		     than a component, because for the first frames index.html and the
		     sheets it links are all the browser has. Beside #app rather than
		     inside it, because application() replaces that element the moment
		     the bundle evaluates, which is where the wait starts and not where
		     it ends. src/_shared/services/splash.mts takes it down.

		     The mark is public/icon.svg, so the installed app's startup image
		     hands over to the same drawing. Its fills stay literal: var() is not
		     allowed in a presentation attribute, and --color-die-border,
		     --color-die-face and --color-die-dot are pinned to exactly these
		     values in both themes, so there is nothing here for one to change.
		     The width and height are on the element for the same reason
		     pip-die.mts carries its own (#97).

		     The two messages below are hidden until the <noscript> block in the
		     head reveals one of them, which is the only case anything here has
		     something to say. Nothing carries aria-hidden but the die: with JS
		     the paragraphs are display:none and so out of the tree anyway, and
		     without it the message is the one thing that has to be read. -->
		<div id="splash">
			<svg viewBox="0 0 32 32" width="96" height="96" aria-hidden="true">
				<rect width="32" height="32" rx="4" fill="#1c1d1f" />
				<rect x="2.24" y="2.24" width="27.52" height="27.52" rx="3.753" fill="#ffffff" />
				<circle cx="8.495" cy="8.495" r="2.627" fill="#1c1d1f" />
				<circle cx="23.505" cy="8.495" r="2.627" fill="#1c1d1f" />
				<circle cx="16" cy="16" r="2.627" fill="#1c1d1f" />
				<circle cx="8.495" cy="23.505" r="2.627" fill="#1c1d1f" />
				<circle cx="23.505" cy="23.505" r="2.627" fill="#1c1d1f" />
			</svg>
			<p class="splash-message splash-message-en" lang="en">Five dice needs JavaScript to keep score.</p>
			<p class="splash-message splash-message-nl" lang="nl">Five dice heeft JavaScript nodig om de score bij te houden.</p>
		</div>
		<div id="app"></div>
	</body>

</html>
