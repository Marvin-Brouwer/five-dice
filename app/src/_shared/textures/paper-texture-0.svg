<!-- scripts/textures/generate.mts: paper variant 0, the fixed original preset. Regenerating it overwrites this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
	<defs>
		<pattern id="__ID__" width="200" height="100" patternUnits="userSpaceOnUse">
			<polygon points="0,0 100,0 60,45" fill="var(--paper-shade-0)"/>
			<polygon points="0,0 0,50 60,45" fill="var(--paper-shade-1)"/>
			<polygon points="100,0 200,0 140,55" fill="var(--paper-shade-2)"/>
			<polygon points="100,0 60,45 140,55" fill="var(--paper-shade-0)"/>
			<polygon points="200,0 200,50 140,55" fill="var(--paper-shade-1)"/>
			<polygon points="0,50 60,45 100,100" fill="var(--paper-shade-2)"/>
			<polygon points="0,50 0,100 100,100" fill="var(--paper-shade-0)"/>
			<polygon points="60,45 140,55 100,100" fill="var(--paper-shade-1)"/>
			<polygon points="140,55 200,50 200,100" fill="var(--paper-shade-0)"/>
			<polygon points="140,55 100,100 200,100" fill="var(--paper-shade-2)"/>
		</pattern>
	</defs>
	<rect width="100%" height="100%" fill="url(#__ID__)"/>
</svg>
